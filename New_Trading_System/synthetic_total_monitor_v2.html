<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthetic TOTAL / TOTAL3 — Macro Trend Monitor v2</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #11151d;
    --panel-alt: #161b26;
    --border: #1f2633;
    --border-hover: #364156;
    --text: #f0f3f6;
    --muted: #7b8696;
    --green: #0ecb81;
    --red: #f6465d;
    --amber: #f0b90b;
    --blue: #3b82f6;
    --cyan: #22d3ee;
  }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .brand-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(59, 130, 246, 0.16);
    border: 1px solid rgba(59, 130, 246, 0.4);
    color: #93c5fd;
    text-transform: uppercase;
  }

  .tf-group {
    display: flex;
    gap: 3px;
    background: rgba(255,255,255,0.02);
    padding: 2px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .tf-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tf-btn:hover { color: var(--text); }
  .tf-btn.active { background: rgba(59, 130, 246, 0.24); color: #fff; }

  .regime-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--muted);
    letter-spacing: 0.03em;
  }
  .regime-pill.risk-on { background: rgba(14, 203, 129, 0.15); border-color: rgba(14, 203, 129, 0.45); color: var(--green); }
  .regime-pill.risk-off { background: rgba(246, 70, 93, 0.15); border-color: rgba(246, 70, 93, 0.45); color: var(--red); }
  .regime-pill.btc-dom { background: rgba(240, 185, 11, 0.14); border-color: rgba(240, 185, 11, 0.45); color: var(--amber); }
  .regime-pill.alt-rot { background: rgba(34, 211, 238, 0.14); border-color: rgba(34, 211, 238, 0.45); color: var(--cyan); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .toggle-btn {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .toggle-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .toggle-btn.active {
    background: rgba(14, 203, 129, 0.12);
    border-color: rgba(14, 203, 129, 0.45);
    color: var(--green);
  }
  .toggle-btn.amber.active {
    background: rgba(240, 185, 11, 0.14);
    border-color: rgba(240, 185, 11, 0.45);
    color: var(--amber);
  }
  .toggle-btn.blue.active {
    background: rgba(59, 130, 246, 0.22);
    border-color: #60a5fa;
    color: #fff;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
    margin-left: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.connecting { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1s infinite; }
  .dot.error { background: var(--red); box-shadow: 0 0 8px var(--red); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  @media (max-width: 820px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .idx-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
    user-select: none;
  }
  .idx-card:hover { border-color: var(--border-hover); background: var(--panel-alt); }
  .idx-card.active {
    border-color: var(--blue);
    background: rgba(59, 130, 246, 0.08);
    box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.25);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .card-name { color: var(--text); font-size: 12.5px; }
  .trend-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 700;
  }
  .trend-tag.bull { background: rgba(14, 203, 129, 0.16); color: var(--green); }
  .trend-tag.bear { background: rgba(246, 70, 93, 0.16); color: var(--red); }
  .card-mid {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .card-val {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .card-chg {
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .card-sub {
    font-size: 10.5px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  #chart-wrapper {
    flex-grow: 1;
    position: relative;
    min-height: 0;
    width: 100%;
  }
  #chart-container {
    position: absolute;
    inset: 0;
  }

  #legend-box {
    position: absolute;
    top: 10px;
    left: 12px;
    z-index: 10;
    pointer-events: none;
    background: rgba(17, 21, 29, 0.9);
    backdrop-filter: blur(5px);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 11px;
    font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
    font-size: 11.5px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .leg-title { font-weight: 700; color: var(--text); font-family: -apple-system, sans-serif; }
  .leg-item { color: var(--muted); }
  .leg-item b { color: var(--text); }

  #basket-drawer {
    position: absolute;
    top: 10px;
    right: 76px;
    width: 345px;
    max-height: calc(100% - 36px);
    background: rgba(17, 21, 29, 0.96);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 8px;
    z-index: 15;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.55);
  }
  #basket-drawer.open { display: flex; }
  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
  }
  .drawer-close {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .drawer-close:hover { color: var(--text); }
  .drawer-meta {
    padding: 7px 12px;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    line-height: 1.45;
  }
  .basket-list {
    overflow-y: auto;
    padding: 6px 10px;
  }
  .coin-row {
    display: grid;
    grid-template-columns: 56px 1fr 62px 54px;
    align-items: center;
    gap: 6px;
    padding: 5px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .coin-sym { font-weight: 700; color: var(--text); }
  .coin-cap { color: var(--muted); text-align: right; }
  .coin-wt { color: var(--muted); text-align: right; font-size: 10.5px; }
  .coin-chg { text-align: right; font-weight: 600; }

  #error-banner {
    display: none;
    position: absolute;
    top: 52px;
    left: 16px;
    right: 16px;
    z-index: 20;
    background: rgba(246, 70, 93, 0.15);
    border: 1px solid rgba(246, 70, 93, 0.45);
    color: #ff98a7;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
  }
  #error-banner.visible { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="brand">
      Synthetic CryptoCap
      <span class="brand-tag">Hybrid v2</span>
    </div>
    <div class="tf-group" id="tf-group">
      <button class="tf-btn" data-tf="15m">15m</button>
      <button class="tf-btn active" data-tf="1h">H1</button>
      <button class="tf-btn" data-tf="4h">H4</button>
      <button class="tf-btn" data-tf="1d">1D</button>
    </div>
    <span id="market-regime" class="regime-pill">РЕЖИМ: ЗАГРУЗКА...</span>
  </div>

  <div class="header-right">
    <button class="toggle-btn active" id="btn-st" title="SuperTrend (10, 3)">SuperTrend</button>
    <button class="toggle-btn amber active" id="btn-ema20" title="EMA 20">EMA 20</button>
    <button class="toggle-btn blue active" id="btn-ema50" title="EMA 50">EMA 50</button>
    <button class="toggle-btn active" id="btn-calibrate" title="Калибровать к глобальной капитализации CoinGecko">Масштаб TV</button>
    <button class="toggle-btn" id="btn-autoscale" title="Вернуть авто-масштаб цены и времени">Авто</button>
    <button class="toggle-btn" id="btn-basket" title="Состав синтетической корзины и веса">Корзина</button>
    <div class="status">
      <span class="dot connecting" id="status-dot"></span>
      <span id="status-text">Загрузка...</span>
    </div>
  </div>
</div>

<div class="cards-grid">
  <div class="idx-card" data-index="TOTAL">
    <div class="card-top">
      <span class="card-name">TOTAL</span>
      <span class="trend-tag" id="trend-TOTAL">—</span>
    </div>
    <div class="card-mid">
      <span class="card-val" id="val-TOTAL">—</span>
      <span class="card-chg" id="chg-TOTAL">—</span>
    </div>
    <div class="card-sub">
      <span>Весь рынок</span>
      <span id="st-dist-TOTAL">ST: —</span>
    </div>
  </div>

  <div class="idx-card" data-index="TOTAL2">
    <div class="card-top">
      <span class="card-name">TOTAL2</span>
      <span class="trend-tag" id="trend-TOTAL2">—</span>
    </div>
    <div class="card-mid">
      <span class="card-val" id="val-TOTAL2">—</span>
      <span class="card-chg" id="chg-TOTAL2">—</span>
    </div>
    <div class="card-sub">
      <span>Без BTC</span>
      <span id="st-dist-TOTAL2">ST: —</span>
    </div>
  </div>

  <div class="idx-card active" data-index="TOTAL3">
    <div class="card-top">
      <span class="card-name">TOTAL3</span>
      <span class="trend-tag" id="trend-TOTAL3">—</span>
    </div>
    <div class="card-mid">
      <span class="card-val" id="val-TOTAL3">—</span>
      <span class="card-chg" id="chg-TOTAL3">—</span>
    </div>
    <div class="card-sub">
      <span>Альты (без BTC/ETH)</span>
      <span id="st-dist-TOTAL3">ST: —</span>
    </div>
  </div>

  <div class="idx-card" data-index="BTCD">
    <div class="card-top">
      <span class="card-name">BTC.D (Синт.)</span>
      <span class="trend-tag" id="trend-BTCD">—</span>
    </div>
    <div class="card-mid">
      <span class="card-val" id="val-BTCD">—</span>
      <span class="card-chg" id="chg-BTCD">—</span>
    </div>
    <div class="card-sub">
      <span>Доля BTC в корзине</span>
      <span id="st-dist-BTCD">ST: —</span>
    </div>
  </div>
</div>

<div id="chart-wrapper">
  <div id="chart-container"></div>

  <div id="legend-box">
    <span class="leg-title" id="leg-name">TOTAL3</span>
    <span class="leg-item">O <b id="leg-o">—</b></span>
    <span class="leg-item">H <b id="leg-h">—</b></span>
    <span class="leg-item">L <b id="leg-l">—</b></span>
    <span class="leg-item">C <b id="leg-c">—</b></span>
    <span class="leg-item" style="color:var(--amber)">EMA20 <b id="leg-ema20" style="color:var(--amber)">—</b></span>
    <span class="leg-item" style="color:#60a5fa">EMA50 <b id="leg-ema50" style="color:#60a5fa">—</b></span>
    <span class="leg-item">ST <b id="leg-st">—</b></span>
  </div>

  <div id="basket-drawer">
    <div class="drawer-header">
      <span>Состав гибридной корзины</span>
      <button class="drawer-close" id="btn-close-basket">✕</button>
    </div>
    <div class="drawer-meta" id="basket-meta">Загрузка метаданных...</div>
    <div class="basket-list" id="basket-list"></div>
  </div>

  <div id="error-banner"></div>
</div>

<script>
(function loadChartLib() {
  const CDNS = [
    'https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
    'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.min.js'
  ];
  let idx = 0;
  function next() {
    if (window.LightweightCharts) return startApp();
    if (idx >= CDNS.length) {
      document.getElementById('error-banner').textContent = 'Не удалось загрузить Lightweight Charts. Проверьте интернет.';
      document.getElementById('error-banner').classList.add('visible');
      return;
    }
    const s = document.createElement('script');
    s.src = CDNS[idx++];
    s.async = true;
    s.onload = () => window.LightweightCharts ? startApp() : next();
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();

function startApp() {
  const BASKET = [
    { cgId: 'bitcoin',          symbol: 'BTCUSDT',  ticker: 'BTC',  group: 'btc', fallbackSupply: 19950000 },
    { cgId: 'ethereum',         symbol: 'ETHUSDT',  ticker: 'ETH',  group: 'eth', fallbackSupply: 120700000 },
    { cgId: 'solana',           symbol: 'SOLUSDT',  ticker: 'SOL',  group: 'alt', fallbackSupply: 520000000 },
    { cgId: 'binancecoin',      symbol: 'BNBUSDT',  ticker: 'BNB',  group: 'alt', fallbackSupply: 141000000 },
    { cgId: 'ripple',           symbol: 'XRPUSDT',  ticker: 'XRP',  group: 'alt', fallbackSupply: 58500000000 },
    { cgId: 'dogecoin',         symbol: 'DOGEUSDT', ticker: 'DOGE', group: 'alt', fallbackSupply: 149000000000 },
    { cgId: 'cardano',          symbol: 'ADAUSDT',  ticker: 'ADA',  group: 'alt', fallbackSupply: 35300000000 },
    { cgId: 'tron',             symbol: 'TRXUSDT',  ticker: 'TRX',  group: 'alt', fallbackSupply: 94800000000 },
    { cgId: 'avalanche-2',      symbol: 'AVAXUSDT', ticker: 'AVAX', group: 'alt', fallbackSupply: 416000000 },
    { cgId: 'chainlink',        symbol: 'LINKUSDT', ticker: 'LINK', group: 'alt', fallbackSupply: 657000000 },
    { cgId: 'sui',              symbol: 'SUIUSDT',  ticker: 'SUI',  group: 'alt', fallbackSupply: 3300000000 },
    { cgId: 'the-open-network', symbol: 'TONUSDT',  ticker: 'TON',  group: 'alt', fallbackSupply: 2500000000 },
    { cgId: 'polkadot',         symbol: 'DOTUSDT',  ticker: 'DOT',  group: 'alt', fallbackSupply: 1560000000 },
    { cgId: 'litecoin',         symbol: 'LTCUSDT',  ticker: 'LTC',  group: 'alt', fallbackSupply: 75800000 },
    { cgId: 'stellar',          symbol: 'XLMUSDT',  ticker: 'XLM',  group: 'alt', fallbackSupply: 30800000000 },
    { cgId: 'hedera-hashgraph', symbol: 'HBARUSDT', ticker: 'HBAR', group: 'alt', fallbackSupply: 42200000000 },
    { cgId: 'uniswap',          symbol: 'UNIUSDT',  ticker: 'UNI',  group: 'alt', fallbackSupply: 600000000 },
    { cgId: 'bitcoin-cash',     symbol: 'BCHUSDT',  ticker: 'BCH',  group: 'alt', fallbackSupply: 19850000 },
    { cgId: 'near',             symbol: 'NEARUSDT', ticker: 'NEAR', group: 'alt', fallbackSupply: 1210000000 },
    { cgId: 'aave',             symbol: 'AAVEUSDT', ticker: 'AAVE', group: 'alt', fallbackSupply: 15100000 }
  ];

  const BINANCE_BASES = [
    'https://data-api.binance.vision/api/v3',
    'https://api.binance.com/api/v3',
    'https://api1.binance.com/api/v3'
  ];
  const TF_SECONDS = { '15m': 900, '1h': 3600, '4h': 14400, '1d': 86400 };
  const CG_CACHE_KEY = 'synth_total_cg_cache_v2';
  const CG_CACHE_TTL_MS = 6 * 3600 * 1000;

  let activeIndex = 'TOTAL3';
  let activeTF = '1h';
  const LAYERS = { st: true, ema20: true, ema50: true, calibrate: true };

  let supplyMap = {};
  let globalSnapshot = null;
  let supplySource = 'Резервный справочник';
  let rawKlinesBySymbol = {};
  let loadedSymbols = [];
  let droppedSymbols = [];
  let timeline = []; // эталонные таймстемпы по BTCUSDT

  // Значения TOTAL / TOTAL2 / TOTAL3 хранятся в МИЛЛИАРДАХ USD ($B) для безупречной работы шкалы Lightweight Charts
  let seriesStore = { TOTAL: [], TOTAL2: [], TOTAL3: [], BTCD: [] };
  let indicatorsStore = {};
  let scaleFactors = { TOTAL: 1, TOTAL2: 1, TOTAL3: 1, BTCD: 1 };

  let ws = null;
  let wsGen = 0;
  let wsUpdateTimer = null;
  let loadController = null;

  // --- ФОРМАТИРОВАНИЕ (значения в $B для капитализаций и в % для BTCD) ---
  function fmtBillions(valB) {
    if (!Number.isFinite(valB)) return '—';
    const abs = Math.abs(valB);
    if (abs >= 1000) return '$' + (valB / 1000).toFixed(2) + 'T';
    if (abs >= 1)    return '$' + valB.toFixed(2) + 'B';
    return '$' + (valB * 1000).toFixed(1) + 'M';
  }
  function fmtValByIndex(indexKey, val) {
    if (!Number.isFinite(val)) return '—';
    return indexKey === 'BTCD' ? val.toFixed(2) + '%' : fmtBillions(val);
  }

  function setStatus(type, text) {
    document.getElementById('status-dot').className = 'dot ' + type;
    document.getElementById('status-text').textContent = text;
  }
  function showError(msg) {
    const el = document.getElementById('error-banner');
    el.textContent = msg;
    el.classList.add('visible');
  }
  function hideError() {
    document.getElementById('error-banner').classList.remove('visible');
  }

  // --- ГРАФИК ---
  const chartContainer = document.getElementById('chart-container');
  const chart = LightweightCharts.createChart(chartContainer, {
    layout: { background: { type: 'solid', color: '#0b0e14' }, textColor: '#7b8696' },
    grid: { vertLines: { color: '#151a24' }, horzLines: { color: '#151a24' } },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#1f2633', rightOffset: 8 },
    rightPriceScale: { borderColor: '#1f2633', autoScale: true, scaleMargins: { top: 0.1, bottom: 0.08 } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    width: chartContainer.clientWidth,
    height: chartContainer.clientHeight
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: '#0ecb81', downColor: '#f6465d',
    borderUpColor: '#0ecb81', borderDownColor: '#f6465d',
    wickUpColor: '#0ecb81', wickDownColor: '#f6465d'
  });
  const ema20Series = chart.addLineSeries({
    color: '#f0b90b', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false
  });
  const ema50Series = chart.addLineSeries({
    color: '#3b82f6', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false
  });
  const stBullSeries = chart.addLineSeries({
    color: '#0ecb81', lineWidth: 2, priceLineVisible: false, lastValueVisible: false
  });
  const stBearSeries = chart.addLineSeries({
    color: '#f6465d', lineWidth: 2, priceLineVisible: false, lastValueVisible: false
  });

  new ResizeObserver(entries => {
    if (!entries.length) return;
    const { width, height } = entries[0].contentRect;
    chart.applyOptions({ width, height });
  }).observe(document.getElementById('chart-wrapper'));

  // --- ИНДИКАТОРЫ ---
  function calcEMA(bars, period) {
    const out = [];
    const map = new Map();
    if (bars.length < period) return { out, map };
    const k = 2 / (period + 1);
    let sum = 0;
    for (let i = 0; i < period; i++) sum += bars[i].close;
    let ema = sum / period;
    out.push({ time: bars[period - 1].time, value: ema });
    map.set(bars[period - 1].time, ema);
    for (let i = period; i < bars.length; i++) {
      ema = bars[i].close * k + ema * (1 - k);
      out.push({ time: bars[i].time, value: ema });
      map.set(bars[i].time, ema);
    }
    return { out, map };
  }

  function calcSuperTrend(bars, atrPeriod = 10, mult = 3.0) {
    const bull = [];
    const bear = [];
    const map = new Map();
    if (bars.length < atrPeriod + 2) return { bull, bear, map, lastDir: 0, lastVal: NaN };

    let atr = 0, trSum = 0, finalUpper = 0, finalLower = 0, dir = 1;

    for (let i = 0; i < bars.length; i++) {
      const b = bars[i];
      const tr = i === 0
        ? (b.high - b.low)
        : Math.max(b.high - b.low, Math.abs(b.high - bars[i - 1].close), Math.abs(b.low - bars[i - 1].close));

      if (i < atrPeriod - 1) {
        trSum += tr;
        continue;
      } else if (i === atrPeriod - 1) {
        trSum += tr;
        atr = trSum / atrPeriod;
        const hl2 = (b.high + b.low) / 2;
        finalUpper = hl2 + mult * atr;
        finalLower = hl2 - mult * atr;
        dir = b.close >= hl2 ? 1 : -1;
      } else {
        atr = (atr * (atrPeriod - 1) + tr) / atrPeriod;
        const hl2 = (b.high + b.low) / 2;
        const basicUpper = hl2 + mult * atr;
        const basicLower = hl2 - mult * atr;
        const prevClose = bars[i - 1].close;

        finalUpper = (basicUpper < finalUpper || prevClose > finalUpper) ? basicUpper : finalUpper;
        finalLower = (basicLower > finalLower || prevClose < finalLower) ? basicLower : finalLower;

        if (dir === 1 && b.close < finalLower) dir = -1;
        else if (dir === -1 && b.close > finalUpper) dir = 1;
      }

      const val = dir === 1 ? finalLower : finalUpper;
      if (!Number.isFinite(val)) continue;
      map.set(b.time, { val, dir });
      if (dir === 1) {
        bull.push({ time: b.time, value: val });
        bear.push({ time: b.time });
      } else {
        bear.push({ time: b.time, value: val });
        bull.push({ time: b.time });
      }
    }

    const last = map.get(bars[bars.length - 1].time) || { dir: 0, val: NaN };
    return { bull, bear, map, lastDir: last.dir, lastVal: last.val };
  }

  // --- COINGECKO SUPPLY + GLOBAL ---
  async function loadSuppliesAndGlobal() {
    BASKET.forEach(c => { supplyMap[c.symbol] = c.fallbackSupply; });
    supplySource = 'Резервный справочник';

    try {
      const cachedRaw = localStorage.getItem(CG_CACHE_KEY);
      if (cachedRaw) {
        const cached = JSON.parse(cachedRaw);
        if (Date.now() - cached.ts < CG_CACHE_TTL_MS && cached.supplies) {
          Object.assign(supplyMap, cached.supplies);
          globalSnapshot = cached.global || null;
          supplySource = 'CoinGecko (кеш)';
          return;
        }
      }
    } catch (e) {}

    try {
      const ids = BASKET.map(c => c.cgId).join(',');
      const [mkRes, glRes] = await Promise.all([
        fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&per_page=50`),
        fetch('https://api.coingecko.com/api/v3/global')
      ]);

      const freshSupplies = {};
      if (mkRes.ok) {
        const list = await mkRes.json();
        const byId = Object.fromEntries(list.map(x => [x.id, x.circulating_supply]));
        BASKET.forEach(c => {
          if (byId[c.cgId] > 0) {
            supplyMap[c.symbol] = byId[c.cgId];
            freshSupplies[c.symbol] = byId[c.cgId];
          }
        });
        supplySource = 'CoinGecko Live';
      }

      if (glRes.ok) {
        const glJson = await glRes.json();
        const d = glJson && glJson.data;
        if (d && d.total_market_cap && d.total_market_cap.usd) {
          globalSnapshot = {
            totalBillions: d.total_market_cap.usd / 1e9,
            btcPct: (d.market_cap_percentage?.btc || 55) / 100,
            ethPct: (d.market_cap_percentage?.eth || 12) / 100
          };
        }
      }

      if (Object.keys(freshSupplies).length > 0) {
        localStorage.setItem(CG_CACHE_KEY, JSON.stringify({
          ts: Date.now(),
          supplies: freshSupplies,
          global: globalSnapshot
        }));
      }
    } catch (e) {
      console.warn('[CoinGecko] Используем резервный supply:', e);
    }
  }

  // --- BINANCE KLINES ---
  let workingBase = BINANCE_BASES[0];

  async function fetchKlineForCoin(symbol, interval, limit, signal) {
    const bases = [workingBase, ...BINANCE_BASES.filter(b => b !== workingBase)];
    for (const base of bases) {
      try {
        const res = await fetch(`${base}/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`, { signal });
        if (!res.ok) continue;
        workingBase = base;
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length === 0) continue;
        const map = new Map();
        let lastTime = 0;
        for (const k of rows) {
          const t = Math.floor(k[0] / 1000);
          map.set(t, {
            open: parseFloat(k[1]),
            high: parseFloat(k[2]),
            low: parseFloat(k[3]),
            close: parseFloat(k[4])
          });
          if (t > lastTime) lastTime = t;
        }
        return { symbol, map, lastTime };
      } catch (e) {
        if (signal && signal.aborted) throw e;
      }
    }
    return null;
  }

  // --- СБОРКА СИНТЕТИЧЕСКИХ ИНДЕКСОВ (В МИЛЛИАРДАХ $B, С FORWARD-FILL ПРОПУСКОВ) ---
  function computeSyntheticSeries() {
    if (loadedSymbols.length === 0 || timeline.length === 0) return;

    const rawT = [], rawT2 = [], rawT3 = [], rawBtcd = [];
    const bySym = Object.fromEntries(BASKET.map(c => [c.symbol, c]));

    // Предварительно находим первую известную свечу для каждой монеты (для аккуратного старта)
    const lastKnown = {};
    for (const sym of loadedSymbols) {
      const m = rawKlinesBySymbol[sym];
      for (const t of timeline) {
        if (m.has(t)) { lastKnown[sym] = m.get(t); break; }
      }
    }

    for (const t of timeline) {
      let btcO = 0, btcH = 0, btcL = 0, btcC = 0;
      let ethO = 0, ethH = 0, ethL = 0, ethC = 0;
      let altO = 0, altH = 0, altL = 0, altC = 0;

      for (const sym of loadedSymbols) {
        let k = rawKlinesBySymbol[sym].get(t);
        if (k) {
          lastKnown[sym] = k;
        } else if (lastKnown[sym]) {
          // Forward-fill редкого пропущенного бара без искажения графика
          const cVal = lastKnown[sym].close;
          k = { open: cVal, high: cVal, low: cVal, close: cVal };
        } else {
          continue;
        }

        const supB = (supplyMap[sym] || 0) / 1e9; // переводим сразу в миллиарды USD ($B)
        const o = k.open * supB, h = k.high * supB, l = k.low * supB, c = k.close * supB;
        const grp = bySym[sym].group;
        if (grp === 'btc') { btcO += o; btcH += h; btcL += l; btcC += c; }
        else if (grp === 'eth') { ethO += o; ethH += h; ethL += l; ethC += c; }
        else { altO += o; altH += h; altL += l; altC += c; }
      }

      if (!(btcC > 0 && altC > 0)) continue;

      const t3O = altO, t3C = altC;
      const t3H = Math.max(altH, t3O, t3C), t3L = Math.min(altL, t3O, t3C);

      const t2O = ethO + altO, t2C = ethC + altC;
      const t2H = Math.max(ethH + altH, t2O, t2C), t2L = Math.min(ethL + altL, t2O, t2C);

      const totO = btcO + t2O, totC = btcC + t2C;
      const totH = Math.max(btcH + ethH + altH, totO, totC), totL = Math.min(btcL + ethL + altL, totO, totC);

      rawT.push({ time: t, open: totO, high: totH, low: totL, close: totC });
      rawT2.push({ time: t, open: t2O, high: t2H, low: t2L, close: t2C });
      rawT3.push({ time: t, open: t3O, high: t3H, low: t3L, close: t3C });

      const dO = (btcO / totO) * 100;
      const dC = (btcC / totC) * 100;
      const d1 = (btcH / totH) * 100;
      const d2 = (btcL / totL) * 100;
      rawBtcd.push({
        time: t,
        open: dO,
        high: Math.max(dO, dC, d1, d2),
        low: Math.min(dO, dC, d1, d2),
        close: dC
      });
    }

    const lastIdx = rawT.length - 1;
    if (LAYERS.calibrate && globalSnapshot && lastIdx >= 0 && rawT[lastIdx].close > 0) {
      const gTotal = globalSnapshot.totalBillions;
      const gTotal2 = gTotal * (1 - globalSnapshot.btcPct);
      const gTotal3 = gTotal * (1 - globalSnapshot.btcPct - globalSnapshot.ethPct);
      const gBtcd = globalSnapshot.btcPct * 100;

      scaleFactors.TOTAL  = gTotal  / rawT[lastIdx].close;
      scaleFactors.TOTAL2 = gTotal2 / Math.max(0.01, rawT2[lastIdx].close);
      scaleFactors.TOTAL3 = gTotal3 / Math.max(0.01, rawT3[lastIdx].close);
      scaleFactors.BTCD   = gBtcd   / Math.max(0.01, rawBtcd[lastIdx].close);
    } else {
      scaleFactors = { TOTAL: 1, TOTAL2: 1, TOTAL3: 1, BTCD: 1 };
    }

    const applyScale = (arr, k) => arr.map(b => ({
      time: b.time,
      open: b.open * k,
      high: b.high * k,
      low: b.low * k,
      close: b.close * k
    }));

    seriesStore.TOTAL  = applyScale(rawT, scaleFactors.TOTAL);
    seriesStore.TOTAL2 = applyScale(rawT2, scaleFactors.TOTAL2);
    seriesStore.TOTAL3 = applyScale(rawT3, scaleFactors.TOTAL3);
    seriesStore.BTCD   = applyScale(rawBtcd, scaleFactors.BTCD);

    ['TOTAL', 'TOTAL2', 'TOTAL3', 'BTCD'].forEach(key => {
      const bars = seriesStore[key];
      indicatorsStore[key] = {
        ema20: calcEMA(bars, 20),
        ema50: calcEMA(bars, 50),
        st: calcSuperTrend(bars, 10, 3.0)
      };
    });

    updateSummaryCardsAndRegime();
    renderBasketDrawer();
  }

  function updateSummaryCardsAndRegime() {
    const barsPer24h = { '15m': 96, '1h': 24, '4h': 6, '1d': 1 }[activeTF] || 24;

    ['TOTAL', 'TOTAL2', 'TOTAL3', 'BTCD'].forEach(key => {
      const bars = seriesStore[key];
      const ind = indicatorsStore[key];
      if (!bars || bars.length === 0) return;

      const last = bars[bars.length - 1];
      const ref = bars[Math.max(0, bars.length - 1 - barsPer24h)];
      const chgPct = ref.close > 0 ? ((last.close - ref.close) / ref.close) * 100 : 0;

      document.getElementById(`val-${key}`).textContent = fmtValByIndex(key, last.close);
      const chgEl = document.getElementById(`chg-${key}`);
      chgEl.textContent = `${chgPct >= 0 ? '+' : ''}${chgPct.toFixed(2)}%`;
      chgEl.className = 'card-chg ' + (chgPct >= 0 ? 'up' : 'down');

      const dir = ind.st.lastDir;
      const tagEl = document.getElementById(`trend-${key}`);
      tagEl.textContent = dir === 1 ? 'BULL ▲' : (dir === -1 ? 'BEAR ▼' : 'FLAT');
      tagEl.className = 'trend-tag ' + (dir === 1 ? 'bull' : (dir === -1 ? 'bear' : ''));

      const stDistEl = document.getElementById(`st-dist-${key}`);
      if (Number.isFinite(ind.st.lastVal) && ind.st.lastVal > 0) {
        const distPct = ((last.close - ind.st.lastVal) / ind.st.lastVal) * 100;
        stDistEl.textContent = `ST: ${distPct >= 0 ? '+' : ''}${distPct.toFixed(1)}%`;
      }
    });

    const tDir = indicatorsStore.TOTAL?.st.lastDir || 0;
    const t3Dir = indicatorsStore.TOTAL3?.st.lastDir || 0;
    const regEl = document.getElementById('market-regime');

    if (tDir === 1 && t3Dir === 1) {
      regEl.className = 'regime-pill risk-on';
      regEl.textContent = 'РЕЖИМ: RISK-ON (ПРИТОК В РЫНОК)';
    } else if (tDir === -1 && t3Dir === -1) {
      regEl.className = 'regime-pill risk-off';
      regEl.textContent = 'РЕЖИМ: RISK-OFF (СЛИВ / ПРИОРИТЕТ ШОРТ)';
    } else if (tDir === 1 && t3Dir === -1) {
      regEl.className = 'regime-pill btc-dom';
      regEl.textContent = 'РЕЖИМ: ПЫЛЕСОС BTC (АЛЬТЫ СЛАБЫЕ)';
    } else if (tDir === -1 && t3Dir === 1) {
      regEl.className = 'regime-pill alt-rot';
      regEl.textContent = 'РЕЖИМ: АЛЬТ-РОТАЦИЯ (СИЛА TOTAL3)';
    } else {
      regEl.className = 'regime-pill';
      regEl.textContent = 'РЕЖИМ: НЕЙТРАЛЬНЫЙ';
    }
  }

  // --- ОТРИСОВКА АКТИВНОЙ ВКЛАДКИ С ГАРАНТИРОВАННЫМ СБРОСОМ ШКАЛЫ ---
  function renderActiveChart({ resetPriceScale = false, fitTime = false } = {}) {
    const bars = seriesStore[activeIndex] || [];
    const ind = indicatorsStore[activeIndex];
    if (!bars.length || !ind) return;

    const formatter = activeIndex === 'BTCD'
      ? (p => p.toFixed(2) + '%')
      : (p => fmtBillions(p));

    const priceFormat = { type: 'custom', formatter, minMove: 0.01 };

    // При смене вкладки обязательно включаем autoScale ДО заливки новых данных
    if (resetPriceScale) {
      chart.priceScale('right').applyOptions({ autoScale: true });
    }

    candleSeries.applyOptions({ priceFormat });
    ema20Series.applyOptions({ priceFormat });
    ema50Series.applyOptions({ priceFormat });
    stBullSeries.applyOptions({ priceFormat, lastValueVisible: LAYERS.st && ind.st.lastDir === 1 });
    stBearSeries.applyOptions({ priceFormat, lastValueVisible: LAYERS.st && ind.st.lastDir === -1 });

    candleSeries.setData(bars);
    ema20Series.setData(LAYERS.ema20 ? ind.ema20.out : []);
    ema50Series.setData(LAYERS.ema50 ? ind.ema50.out : []);
    stBullSeries.setData(LAYERS.st ? ind.st.bull : []);
    stBearSeries.setData(LAYERS.st ? ind.st.bear : []);

    if (resetPriceScale) {
      chart.priceScale('right').applyOptions({ autoScale: true });
    }

    updateLegendAt(bars[bars.length - 1]);

    if (fitTime) {
      chart.timeScale().setVisibleLogicalRange({
        from: Math.max(0, bars.length - 130),
        to: bars.length + 6
      });
    }
  }

  function updateLegendAt(bar) {
    if (!bar) return;
    const ind = indicatorsStore[activeIndex];
    document.getElementById('leg-name').textContent = activeIndex === 'BTCD' ? 'BTC.D' : activeIndex;
    document.getElementById('leg-o').textContent = fmtValByIndex(activeIndex, bar.open);
    document.getElementById('leg-h').textContent = fmtValByIndex(activeIndex, bar.high);
    document.getElementById('leg-l').textContent = fmtValByIndex(activeIndex, bar.low);
    const cEl = document.getElementById('leg-c');
    cEl.textContent = fmtValByIndex(activeIndex, bar.close);
    cEl.style.color = bar.close >= bar.open ? 'var(--green)' : 'var(--red)';

    const e20 = ind?.ema20.map.get(bar.time);
    const e50 = ind?.ema50.map.get(bar.time);
    const stObj = ind?.st.map.get(bar.time);
    document.getElementById('leg-ema20').textContent = e20 ? fmtValByIndex(activeIndex, e20) : '—';
    document.getElementById('leg-ema50').textContent = e50 ? fmtValByIndex(activeIndex, e50) : '—';
    const stEl = document.getElementById('leg-st');
    if (stObj) {
      stEl.textContent = fmtValByIndex(activeIndex, stObj.val);
      stEl.style.color = stObj.dir === 1 ? 'var(--green)' : 'var(--red)';
    } else {
      stEl.textContent = '—';
      stEl.style.color = 'var(--muted)';
    }
  }

  chart.subscribeCrosshairMove(param => {
    const bars = seriesStore[activeIndex] || [];
    if (!bars.length) return;
    if (param.time && param.seriesData.has(candleSeries)) {
      updateLegendAt(param.seriesData.get(candleSeries));
    } else {
      updateLegendAt(bars[bars.length - 1]);
    }
  });

  function renderBasketDrawer() {
    const metaEl = document.getElementById('basket-meta');
    const listEl = document.getElementById('basket-list');
    if (!metaEl || !listEl || timeline.length === 0) return;

    const lastT = timeline[timeline.length - 1];
    const barsPer24h = { '15m': 96, '1h': 24, '4h': 6, '1d': 1 }[activeTF] || 24;
    const refT = timeline[Math.max(0, timeline.length - 1 - barsPer24h)];

    let rawSumB = 0;
    const rows = loadedSymbols.map(sym => {
      const cfg = BASKET.find(c => c.symbol === sym);
      const map = rawKlinesBySymbol[sym];
      const cur = map.get(lastT);
      const ref = map.get(refT);
      const capB = ((cur?.close || 0) * (supplyMap[sym] || 0)) / 1e9;
      const chg = (cur && ref && ref.close > 0) ? ((cur.close - ref.close) / ref.close) * 100 : 0;
      rawSumB += capB;
      return { ticker: cfg.ticker, capB, chg };
    }).sort((a, b) => b.capB - a.capB);

    const covPct = (globalSnapshot && globalSnapshot.totalBillions > 0)
      ? ((rawSumB / globalSnapshot.totalBillions) * 100).toFixed(1) + '%'
      : '—';
    const droppedNote = droppedSymbols.length > 0
      ? `<br><span style="color:var(--amber)">Исключены (устарели): ${droppedSymbols.join(', ')}</span>`
      : '';

    metaEl.innerHTML =
      `Supply: <b>${supplySource}</b> · Активных: <b>${loadedSymbols.length}/${BASKET.length}</b><br>` +
      `Корзина: <b>${fmtBillions(rawSumB)}</b> (охват Global: <b>${covPct}</b>)${droppedNote}`;

    listEl.innerHTML = rows.map(r => {
      const wt = rawSumB > 0 ? ((r.capB / rawSumB) * 100).toFixed(1) : '0.0';
      const cls = r.chg >= 0 ? 'up' : 'down';
      return `
        <div class="coin-row">
          <span class="coin-sym">${r.ticker}</span>
          <span class="coin-cap">${fmtBillions(r.capB)}</span>
          <span class="coin-wt">${wt}%</span>
          <span class="coin-chg ${cls}">${r.chg >= 0 ? '+' : ''}${r.chg.toFixed(1)}%</span>
        </div>
      `;
    }).join('');
  }

  // --- COMBINED WEBSOCKET ---
  function connectCombinedWS() {
    wsGen += 1;
    const myGen = wsGen;
    if (ws) {
      try { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); } catch (e) {}
    }
    if (loadedSymbols.length === 0) return;

    const streams = loadedSymbols.map(s => `${s.toLowerCase()}@kline_${activeTF}`).join('/');
    ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);

    ws.onopen = () => {
      if (myGen !== wsGen) return;
      setStatus('live', `Онлайн (${loadedSymbols.length} пар)`);
      hideError();
    };

    ws.onmessage = (event) => {
      if (myGen !== wsGen) return;
      let msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }
      const k = msg?.data?.k;
      if (!k) return;

      const sym = k.s;
      const map = rawKlinesBySymbol[sym];
      if (!map) return;

      const t = Math.floor(k.t / 1000);
      map.set(t, {
        open: parseFloat(k.o),
        high: parseFloat(k.h),
        low: parseFloat(k.l),
        close: parseFloat(k.c)
      });

      // Новую свечу на шкалу времени добавляет эталонный BTCUSDT (или когда время новее последнего)
      if (sym === 'BTCUSDT' && timeline.length > 0 && t > timeline[timeline.length - 1]) {
        timeline.push(t);
      }

      if (!wsUpdateTimer) {
        wsUpdateTimer = setTimeout(() => {
          wsUpdateTimer = null;
          if (myGen !== wsGen) return;
          computeSyntheticSeries();
          renderActiveChart({ resetPriceScale: false, fitTime: false });
        }, 600);
      }
    };

    ws.onerror = () => {
      if (myGen !== wsGen) return;
      setStatus('error', 'Ошибка WS');
    };

    ws.onclose = () => {
      if (myGen !== wsGen) return;
      setStatus('connecting', 'Переподключение...');
      setTimeout(() => { if (myGen === wsGen) connectCombinedWS(); }, 4000);
    };
  }

  // --- ЗАГРУЗКА ТАЙМФРЕЙМА ---
  async function loadTimeframe(tf) {
    activeTF = tf;
    if (loadController) loadController.abort();
    loadController = new AbortController();
    const signal = loadController.signal;

    setStatus('connecting', `Загрузка ${tf}...`);
    hideError();

    try {
      if (Object.keys(supplyMap).length === 0) {
        await loadSuppliesAndGlobal();
      }

      const limit = tf === '1d' ? 240 : 300;
      const results = await Promise.all(
        BASKET.map(c => fetchKlineForCoin(c.symbol, tf, limit, signal))
      );

      const validResults = results.filter(r => r && r.map.size > 30);
      if (validResults.length < 5) {
        throw new Error('Слишком мало пар загрузилось с Binance.');
      }

      // Определяем эталонное время по BTCUSDT (или максимальное среди загруженных)
      const btcRes = validResults.find(r => r.symbol === 'BTCUSDT') || validResults[0];
      const anchorLastTime = btcRes.lastTime;
      const maxLag = (TF_SECONDS[tf] || 3600) * 3;

      rawKlinesBySymbol = {};
      loadedSymbols = [];
      droppedSymbols = [];

      for (const r of validResults) {
        if (anchorLastTime - r.lastTime <= maxLag) {
          rawKlinesBySymbol[r.symbol] = r.map;
          loadedSymbols.push(r.symbol);
        } else {
          droppedSymbols.push(r.symbol.replace('USDT', ''));
        }
      }

      // Эталонная временная шкала — отсортированные свечи BTCUSDT
      timeline = Array.from(btcRes.map.keys()).sort((a, b) => a - b);

      document.getElementById('btn-basket').textContent = `Корзина (${loadedSymbols.length})`;
      computeSyntheticSeries();
      renderActiveChart({ resetPriceScale: true, fitTime: true });
      connectCombinedWS();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      console.error(e);
      setStatus('error', 'Ошибка данных');
      showError('Не удалось получить свечи Binance. Проверьте интернет или VPN.');
    }
  }

  // --- ОБРАБОТЧИКИ UI ---
  document.querySelectorAll('.idx-card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = card.dataset.index;
      if (idx === activeIndex) return;
      activeIndex = idx;
      document.querySelectorAll('.idx-card').forEach(c => c.classList.toggle('active', c.dataset.index === idx));
      renderActiveChart({ resetPriceScale: true, fitTime: false });
    });
  });

  document.querySelectorAll('#tf-group .tf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tf = btn.dataset.tf;
      if (tf === activeTF) return;
      document.querySelectorAll('#tf-group .tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadTimeframe(tf);
    });
  });

  function bindToggle(id, key, recomputeAll = false) {
    const btn = document.getElementById(id);
    btn.addEventListener('click', () => {
      LAYERS[key] = !LAYERS[key];
      btn.classList.toggle('active', LAYERS[key]);
      if (recomputeAll) computeSyntheticSeries();
      renderActiveChart({ resetPriceScale: recomputeAll, fitTime: false });
    });
  }
  bindToggle('btn-st', 'st');
  bindToggle('btn-ema20', 'ema20');
  bindToggle('btn-ema50', 'ema50');
  bindToggle('btn-calibrate', 'calibrate', true);

  document.getElementById('btn-autoscale').addEventListener('click', () => {
    renderActiveChart({ resetPriceScale: true, fitTime: true });
  });

  const basketDrawer = document.getElementById('basket-drawer');
  const btnBasket = document.getElementById('btn-basket');
  btnBasket.addEventListener('click', () => {
    const open = basketDrawer.classList.toggle('open');
    btnBasket.classList.toggle('active', open);
  });
  document.getElementById('btn-close-basket').addEventListener('click', () => {
    basketDrawer.classList.remove('open');
    btnBasket.classList.remove('active');
  });

  loadTimeframe('1h');
}
</script>
</body>
</html>
